name: liityntapysakointi
description: Park & Ride commuter app for Finland (Flutter port).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
