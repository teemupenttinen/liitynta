name = "liityntaparkki-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# APP_TOKEN and DIGITRANSIT_API_KEY are set as secrets, not here:
#   wrangler secret put DIGITRANSIT_API_KEY
#   wrangler secret put APP_TOKEN

# Per-IP rate limit: 60 requests per 60 seconds. The worker returns 429
# once a client exceeds the bucket. namespace_id is an arbitrary integer
# unique per Worker (not a Cloudflare resource id).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
